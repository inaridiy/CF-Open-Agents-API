name: Publish npm alpha
# Runs after every successful CI run on main. With pending changesets it opens or updates
# the "Version Packages" pull request; once that is merged and CI passes again, it tags
# the release and publishes both packages with npm trusted publishing (OIDC). Nothing is
# published from a pull request, a tag push or a failed CI run. `workflow_dispatch` reruns
# the same job for the current main, for a publish that failed halfway.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-main
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Verify the commit is on main, the repository is public and reports are private
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          test "$(gh api "repos/$REPOSITORY" --jq .private)" = false
          test "$(gh api "repos/$REPOSITORY/private-vulnerability-reporting" --jq .enabled)" = true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          package-manager-cache: false
      - run: npm install --global pnpm@11.1.2 npm@11.12.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:package
      - name: Version or publish
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          commit-message: "Version packages"
          pr-title: "Version packages"
          # The release script pushes the tags itself, before publishing (see scripts/release.mjs).
          push-git-tags: false
          create-github-releases: false
        env:
          # The changelog generator reads pull request titles and authors.
          GITHUB_TOKEN: ${{ github.token }}
