name: Bug report
description: Report incorrect behavior in a supported configuration.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md; do not include exploit details or secrets here."
  - type: input
    id: version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the request, expected behavior and actual result. Redact credentials and tenant data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node/pnpm versions, harness, model adapter, and local or deployed Workers configuration.
    validations:
      required: true
